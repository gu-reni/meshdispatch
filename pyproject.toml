[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshdispatch"
version = "0.1.0"
description = "Cross-server multi-agent task scheduling and observability over the A2A protocol."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gu-reni" }]
keywords = ["a2a", "agents", "scheduling", "observability", "multi-agent"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.scripts]
meshdispatch = "meshdispatch.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["meshdispatch*"]

[tool.setuptools.package-data]
"meshdispatch.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
