<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="login.title">meshdispatch — sign in</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n.js"></script>
</head>
<body class="login-body">
  <main class="login" aria-labelledby="login-heading">
    <div class="login__top">
      <div class="lang-toggle" role="group" aria-label="Language"
           data-i18n-aria-label="common.language">
        <button class="lang-toggle__btn" type="button" data-lang-value="zh"
                data-i18n="lang.zh">中文</button>
        <button class="lang-toggle__btn" type="button" data-lang-value="en"
                data-i18n="lang.en">English</button>
      </div>
    </div>
    <h1 class="login__title" id="login-heading">meshdispatch</h1>
    <p class="login__lede" data-i18n="login.lede">Sign in to the dashboard.</p>

    <div class="login__tabs" role="tablist" data-i18n-aria-label="login.method"
         aria-label="Sign-in method">
      <button class="login__tab login__tab--active" id="tab-ssh" type="button"
              role="tab" aria-selected="true" aria-controls="panel-ssh"
              data-i18n="login.tab.ssh">SSH key</button>
      <button class="login__tab" id="tab-password" type="button"
              role="tab" aria-selected="false" aria-controls="panel-password"
              data-i18n="login.tab.password">Password</button>
    </div>

    <section class="login__panel" id="panel-ssh" role="tabpanel" aria-labelledby="tab-ssh">
      <label class="field">
        <span class="field__label" data-i18n="common.principal">Principal</span>
        <input class="field__control" type="text" id="ssh-principal"
               autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>

      <div class="task-form__actions">
        <button class="btn" id="ssh-challenge" type="button"
                data-i18n="login.ssh.getChallenge">Get challenge</button>
      </div>

      <div class="login__steps" id="ssh-steps" hidden>
        <p class="field__label" data-i18n="login.ssh.step1">1. Sign this nonce on the machine that holds your key</p>
        <pre class="login__command" id="ssh-command"></pre>
        <p class="note" data-i18n="login.ssh.note">Then paste the contents of the generated signature file below.</p>

        <label class="field">
          <span class="field__label" data-i18n="login.ssh.step2">2. SSH signature</span>
          <textarea class="field__control login__signature" id="ssh-signature"
                    rows="6" autocomplete="off" spellcheck="false"
                    data-i18n-placeholder="login.ssh.signaturePlaceholder"
                    placeholder="-----BEGIN SSH SIGNATURE-----"></textarea>
        </label>

        <div class="task-form__actions">
          <button class="btn" id="ssh-submit" type="button"
                  data-i18n="login.ssh.submit">Sign in with key</button>
        </div>
      </div>

      <p class="note task-form__result" id="ssh-result" hidden></p>
    </section>

    <section class="login__panel" id="panel-password" role="tabpanel" aria-labelledby="tab-password" hidden>
      <label class="field">
        <span class="field__label" data-i18n="common.principal">Principal</span>
        <input class="field__control" type="text" id="password-principal"
               autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>

      <label class="field">
        <span class="field__label" data-i18n="common.password">Password</span>
        <input class="field__control" type="password" id="password-value"
               autocomplete="current-password" required>
      </label>

      <label class="field">
        <span class="field__label" data-i18n="login.password.totpLabel">TOTP code (if required)</span>
        <input class="field__control" type="text" id="password-totp"
               inputmode="numeric" autocomplete="one-time-code"
               data-i18n-placeholder="login.password.totpPlaceholder" placeholder="6-digit code">
      </label>

      <div class="task-form__actions">
        <button class="btn" id="password-submit" type="button"
                data-i18n="common.signIn">Sign in</button>
      </div>

      <p class="note task-form__result" id="password-result" hidden></p>
    </section>
  </main>

  <script src="/static/login.js"></script>
</body>
</html>
